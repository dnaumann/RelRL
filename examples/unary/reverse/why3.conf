[main]
magic = 14
timelimit = 30
memlimit = 1024
running_provers_max = 2

[prover]
name = "CVC5"
version = "1.3.4.dev+main@9dd384b"
shortcut = "cvc5"
driver = "cvc5"
command = "cvc5 --stats-internal --tlimit=%T %f"

[prover]
name = "Z3"
version = "4.15.2"
shortcut = "z3"
driver = "z3_487"
command = "z3 -smt2 -T:%t sat.random_seed=42 nlsat.randomize=false smt.random_seed=42 -st %f"
